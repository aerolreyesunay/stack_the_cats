# Generates the Android app icons. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  # Android 8+ adaptive icon: the cats float over the coral background.
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The foreground artwork already has Android's safe-zone padding built in.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
